<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il magico mondo di Jess</title>
  <meta name="description" content="Impegni, obiettivi e soldi in un posto solo.">

  <!-- App installabile (PWA): nome, icone, colori -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iPhone: aperta dalla schermata Home si apre a schermo intero, senza la barra di Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jess">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#d7f0eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16312d" media="(prefers-color-scheme: dark)">

  <!-- Applica subito il tema salvato, prima che la pagina venga disegnata (evita il "lampo" chiaro) -->
  <script>
    try {
      const tema = localStorage.getItem('tema');
      if (tema) document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>

  <!-- Font: Plus Jakarta Sans per l'interfaccia, Manrope per orari e numeri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <!-- Driver.js: i fumetti del tutorial (stili base; i nostri ritocchi sono in components.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.11.0/dist/driver.css">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <!-- Schermata di accesso: visibile solo quando non c'è nessuno loggato -->
  <div class="login" id="login" hidden>
    <div class="login__inner">
      <!-- Marchio: tre binari, uno per area (Vivaio, Kroma, Personale) -->
      <div class="login__mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 class="login__title">Il magico mondo di Jess</h1>
      <p class="login__lead">Impegni, obiettivi e soldi in un posto solo, giorno per giorno.</p>

      <p class="login__notice" id="login-config" hidden>
        Manca il collegamento a Supabase: inserisci URL e chiave del progetto in <code>js/config.js</code>.
      </p>

      <form class="login__form" id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input class="field" id="login-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input class="field" id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <p class="login__message" id="login-message" role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit" id="login-submit">Accedi</button>
        <button class="btn btn--ghost btn--block" type="button" id="login-switch">Prima volta? Crea l'account</button>
      </form>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <!-- Navigazione: barra in basso su mobile, sidebar su desktop -->
    <nav class="nav" aria-label="Viste">
      <div class="nav__brand">Il magico mondo di Jess</div>
      <a class="nav__link" href="#oggi" data-route="oggi"><span class="nav__icon" data-icon="sun"></span><span>Oggi</span></a>
      <a class="nav__link" href="#calendario" data-route="calendario"><span class="nav__icon" data-icon="calendarRange"></span><span>Calendario</span></a>
      <a class="nav__link" href="#inbox" data-route="inbox"><span class="nav__icon" data-icon="inbox"></span><span>Da fare</span></a>
      <a class="nav__link" href="#obiettivi" data-route="obiettivi"><span class="nav__icon" data-icon="target"></span><span>Obiettivi</span></a>
      <a class="nav__link" href="#soldi" data-route="soldi"><span class="nav__icon" data-icon="wallet"></span><span>Soldi</span></a>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <!-- Foto di Jess (solo nella vista Oggi): toccandola si cambia -->
        <button class="avatar" id="topbar-avatar" type="button" data-action="change-photo" aria-label="Aggiungi o cambia la tua foto" title="Aggiungi la tua foto" hidden>
          <span class="avatar__placeholder" aria-hidden="true" data-icon="camera"></span>
          <img alt="" hidden>
        </button>
        <!-- nascosto solo alla vista: con "hidden" Safari su iPhone a volte non apre la scelta delle foto -->
        <input class="visually-hidden" id="avatar-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
        <div class="topbar__text">
          <p class="topbar__eyebrow" id="view-eyebrow"></p>
          <h1 class="topbar__title" id="view-title" tabindex="-1"></h1>
        </div>
        <div class="topbar__actions">
          <a class="icon-btn" href="#impostazioni" aria-label="Impostazioni" title="Impostazioni"><span data-icon="settings"></span></a>
        </div>
      </header>

      <!-- Qui il router inserisce la vista corrente -->
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <!-- Pulsante di aggiunta rapida, sempre visibile -->
  <button class="fab" id="fab" type="button" aria-label="Aggiungi" aria-keyshortcuts="N" hidden>
    <span data-icon="plus"></span>
  </button>

  <dialog class="sheet" id="quick-add" aria-labelledby="quick-add-title">
    <form class="sheet__body" id="quick-add-form" method="dialog">
      <div class="sheet__head">
        <h2 class="sheet__title" id="quick-add-title">Nuova task</h2>
        <button class="icon-btn" type="button" data-close aria-label="Chiudi"><span data-icon="x"></span></button>
      </div>
      <label class="visually-hidden" for="quick-add-input">Titolo</label>
      <input class="field" id="quick-add-input" name="title" type="text" autocomplete="off" required placeholder="Cosa devi fare?">
      <fieldset class="chip-group" id="quick-add-areas">
        <legend class="visually-hidden">Area</legend>
      </fieldset>
      <p class="sheet__hint" id="quick-add-hint"></p>
      <button class="btn btn--primary btn--block" type="submit">Aggiungi</button>
    </form>
  </dialog>

  <!-- Dettaglio di un elemento: il contenuto del form lo costruisce js/item-editor.js -->
  <dialog class="sheet sheet--tall" id="item-editor" aria-labelledby="item-editor-title">
    <form class="sheet__body" id="item-form" novalidate></form>
  </dialog>

  <!-- Dettaglio di un obiettivo: il form lo costruisce js/goal-editor.js -->
  <dialog class="sheet sheet--tall" id="goal-editor" aria-labelledby="goal-editor-title">
    <form class="sheet__body" id="goal-form" novalidate></form>
  </dialog>

  <!-- Movimento o pagamento ricorrente: il form lo costruisce js/money-editor.js -->
  <dialog class="sheet sheet--tall" id="money-editor" aria-labelledby="money-editor-title">
    <form class="sheet__body" id="money-form" novalidate></form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
