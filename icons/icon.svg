<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icona di Jess: tre "binari" della giornata nei suoi colori (verde-turchese, rosso, marrone caldo)
       su fondo beige. Niente trasparenza e niente angoli arrotondati: l'iPhone li arrotonda da solo. -->
  <rect width="1024" height="1024" fill="#f4eee4"/>
  <g stroke-linecap="round" stroke-width="88">
    <line x1="292" y1="372" x2="560" y2="372" stroke="#0f8f84"/>
    <line x1="388" y1="512" x2="732" y2="512" stroke="#d0443c"/>
    <line x1="512" y1="652" x2="700" y2="652" stroke="#8a6a4a"/>
  </g>
</svg>
